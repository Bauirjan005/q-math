<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="1300" fill="url(#bgGrad2)"/>
  <rect x="30" y="30" width="940" height="1240" rx="16" fill="#131b2e" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>

  <!-- Header -->
  <text x="70" y="85" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="bold" fill="#ffffff">СТЕРЕОМЕТРИЯ: ПРИЗМА МЕН ПИРАМИДАНЫҢ ҚИМАЛАРЫ</text>
  <text x="70" y="115" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#94a3b8">№3 Үй Тапсырмасы • Сызбаларды дәптерге сызғышпен және қарындашпен орындау</text>

  <!-- Diagram Container -->
  <g transform="translate(100, 160)">
    <!-- 3D Pyramid Wireframe -->
    <polygon points="250,50 80,320 380,350" fill="rgba(6,182,212,0.12)" stroke="#38bdf8" stroke-width="3"/>
    <polygon points="250,50 380,350 440,280" fill="rgba(99,102,241,0.15)" stroke="#818cf8" stroke-width="3"/>
    <line x1="80" y1="320" x2="180" y2="250" stroke="#64748b" stroke-dasharray="6,6" stroke-width="2"/>
    <line x1="440" y1="280" x2="180" y2="250" stroke="#64748b" stroke-dasharray="6,6" stroke-width="2"/>
    <line x1="250" y1="50" x2="180" y2="250" stroke="#64748b" stroke-dasharray="6,6" stroke-width="2"/>

    <!-- Cut Plane -->
    <polygon points="190,140 130,240 330,260 360,200" fill="rgba(244,63,94,0.3)" stroke="#f43f5e" stroke-width="2"/>
    <circle cx="250" cy="50" r="5" fill="#fde047"/>
    <text x="255" y="45" font-family="sans-serif" font-size="16" font-weight="bold" fill="#fde047">S (Төбесі)</text>

    <text x="60" y="340" font-family="sans-serif" font-size="16" fill="#fff">A</text>
    <text x="390" y="375" font-family="sans-serif" font-size="16" fill="#fff">B</text>
    <text x="450" y="290" font-family="sans-serif" font-size="16" fill="#fff">C</text>
    <text x="160" y="245" font-family="sans-serif" font-size="16" fill="#94a3b8">D</text>

    <!-- Side Problem Card -->
    <rect x="520" y="40" width="300" height="280" rx="10" fill="#1e293b" stroke="rgba(255,255,255,0.08)"/>
    <text x="540" y="75" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="bold" fill="#34d399">Берілгені:</text>
    <text x="540" y="110" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#cbd5e1">• SABCD — дұрыс төртбұрышты пирамида</text>
    <text x="540" y="140" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#cbd5e1">• Табан қабырғасы: a = 8 см</text>
    <text x="540" y="170" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#cbd5e1">• Бүйір қыры: l = 10 см</text>
    <text x="540" y="200" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#cbd5e1">• Қима биіктігінің 2:1 қатынасында өтеді</text>
    <text x="540" y="245" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="bold" fill="#fde68a">Табу керек:</text>
    <text x="540" y="275" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#fde68a">1) Қима ауданы S_қима</text>
    <text x="540" y="300" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#fde68a">2) Пирамиданың толық көлемі V</text>
  </g>

  <!-- Problem 2 in assignment -->
  <rect x="70" y="580" width="860" height="300" rx="12" fill="#182238" stroke="rgba(255,255,255,0.08)"/>
  <text x="100" y="625" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="bold" fill="#38bdf8">2-Бөлім: Тік призманың бүйір бетінің жазбасы мен диагоналі</text>
  <text x="100" y="665" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" fill="#f1f5f9">Табаны қабырғалары 6 см, 8 см және 10 см болатын тік үшбұрышты тік призма берілген.</text>
  <text x="100" y="695" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" fill="#f1f5f9">Призманың ең үлкен бүйір жағының диагоналі 26 см-ге тең.</text>
  <text x="100" y="740" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#94a3b8">а) Призманың биіктігі h-ты табыңыз (Пифагор теоремасын пайдаланыңыз);</text>
  <text x="100" y="775" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#94a3b8">ә) Призманың бүйір бетінің ауданын S_бүйір = P_табан · h формуласымен есептеңіз;</text>
  <text x="100" y="810" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#34d399">б) Призманың толық көлемін V = S_табан · h формуласымен есептеңіз.</text>
  <text x="100" y="845" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#cbd5e1">Шешуін торкөз геометрия дәптеріне толық түсіндірмемен жазыңыз.</text>

  <!-- Footer note -->
  <text x="70" y="1220" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#64748b">Q-Math AI • Жылдам тапсырма • Оқушының жеке орындауына арналған</text>
</svg>
